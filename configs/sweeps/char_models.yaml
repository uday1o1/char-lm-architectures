# RNN vs GRU vs LSTM vs Transformer on Tiny Shakespeare (characters). The six runs and their
# settings are those of nanolm's configs/sweeps/01_char_models.yaml; rnn_512 is a vanilla RNN with about
# the parameter count of the 2x256 LSTM, to separate gating from size.
# Every run: 2000 steps x 32 x 256 = 16.4M training characters; validation bpb over the 435 complete
# 256-character windows of the validation split (111,360 of its 111,540 characters).
name: char_models
base: ../../external/DeepDataMiningLearning/DeepDataMiningLearning/llm/nanolm/configs/02_char_transformer.yaml
out_dir: runs
seeds: [1337, 42, 1, 2, 3]
common:
  train.max_steps: 2000
  train.seq_len: 256
  train.batch_size: 32
runs:
  - name: rnn
    overrides: {model.arch: rnn, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0}
  - name: rnn_512
    overrides: {model.arch: rnn, model.n_layers: 2, model.dim: 512, train.lr: 2e-3, train.weight_decay: 0.0}
  - name: gru
    overrides: {model.arch: gru, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0}
  - name: lstm
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0}
  - name: lstm_512
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 512, train.lr: 2e-3, train.weight_decay: 0.0}
  - name: gpt_textbook
  - name: gpt_modern
    overrides: {model.norm: rmsnorm, model.pos: rope, model.mlp: swiglu, model.bias: false}
